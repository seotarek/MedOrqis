name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-github-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@seotarek'

      - name: Prepare Scoped Package Manifest for GitHub Packages
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("./package.json", "utf8"));
            pkg.name = "@seotarek/medorqis";
            pkg.publishConfig = {
              "registry": "https://npm.pkg.github.com"
            };
            fs.writeFileSync("./package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log("Configured scoped package name:", pkg.name, "v" + pkg.version);
          '

      - name: Publish Scoped Package to GitHub Packages
        run: |
          PKG_VERSION=$(node -p 'require("./package.json").version')
          echo "Attempting to publish @seotarek/medorqis@$PKG_VERSION to GitHub Packages..."
          OUTPUT=$(npm publish 2>&1) && {
            echo "$OUTPUT"
            echo "Successfully published @seotarek/medorqis@$PKG_VERSION"
          } || {
            EXIT_CODE=$?
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q "Cannot publish over existing version"; then
              echo "Notice: @seotarek/medorqis@$PKG_VERSION is already published to GitHub Packages. Skipping (idempotent)."
              exit 0
            else
              echo "Error: Publishing failed with non-conflict error."
              exit $EXIT_CODE
            fi
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
