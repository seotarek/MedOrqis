[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medorqis"
version = "2.1.1"
description = "MedOrqis — Medical AI Skills Ecosystem: 24 Specialized Clinical AI Skills, Deterministic Safety Guardrails & Zero-Token Calculators."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Tarek Mohamed", email = "seotarek@gmail.com" }]
keywords = ["medical-ai", "clinical-decision-support", "mcp", "claude-skills", "gemini-extensions", "patient-safety", "zero-token"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.20.0"
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
dev = [
    "pytest>=8.0.0",
    "pydantic>=2.0.0"
]

[project.scripts]
medorqis-mcp = "mcp_server.medorqis_mcp_server:run_stdio_server"

[project.urls]
Homepage = "https://seotarek.github.io/MedOrqis/"
Repository = "https://github.com/seotarek/MedOrqis"
Documentation = "https://seotarek.github.io/MedOrqis/"
Zenodo_DOI = "https://doi.org/10.5281/zenodo.23937802"
HuggingFace_Space = "https://huggingface.co/spaces/seotarek/MedOrqis"
HuggingFace_Dataset = "https://huggingface.co/datasets/seotarek/medorqis-clinical-dialect-benchmark"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "mcp_server*", "adapters*"]
exclude = ["tests*", "chat*", "assets*", "docs*", "governance*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md"]
